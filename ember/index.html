<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Ember — Habit Tracker</title>
  <meta name="description" content="Ember — a beautiful, science-backed habit tracker. Small habits, kept alive daily." />
  <meta name="theme-color" content="#0A0B10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-action="tab" data-tab="today" aria-label="Today">
        <svg viewBox="0 0 24 24"><path d="M12 3c.9 3.1 4.6 4.9 4.6 9.3A4.6 4.6 0 0 1 12 17a4.6 4.6 0 0 1-4.6-4.7c0-1.8.8-3 1.7-4 .2 1.5 1 2.4 2 2.7C10.6 8.2 11 5.5 12 3Z"/><path d="M5 21h14"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-action="tab" data-tab="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Progress</span>
      </button>
      <button class="fab" data-action="new" aria-label="New habit">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-action="tab" data-tab="habits" aria-label="Habits">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="2"/><rect x="3" y="10" width="18" height="4.5" rx="2"/><rect x="3" y="16" width="12" height="4.5" rx="2"/></svg>
        <span>Habits</span>
      </button>
      <button class="tab" data-action="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <script src="app.js"></script>
</body>
</html>
