<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Ember — Habit Tracker</title>
  <meta name="description" content="Ember — a beautiful, science-backed habit tracker. Small habits, kept alive daily." />
  <meta name="theme-color" content="#0C0C0E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-action="tab" data-tab="today" aria-label="Today"><span class="pillbg"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></span><span>Today</span></button>
      <button class="tab" data-action="tab" data-tab="progress" aria-label="Progress"><span class="pillbg"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg></span><span>Progress</span></button>
      <button class="tab" data-action="tab" data-tab="habits" aria-label="Habits"><span class="pillbg"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></svg></span><span>Habits</span></button>
      <button class="tab" data-action="tab" data-tab="settings" aria-label="You"><span class="pillbg"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></svg></span><span>You</span></button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
